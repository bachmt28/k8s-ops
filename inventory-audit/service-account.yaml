---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inventory-audit-cluster-role
rules:
  # 1. Cơ sở hạ tầng (Cực kỳ quan trọng để Inventory)
  - apiGroups: [""]
    resources:
      - nodes        # Biết cluster có bao nhiêu node, cấu hình ra sao
      - namespaces   # Danh sách các "vùng đất"
      - events       # Để audit xem có biến động gì không
    verbs: ["get", "list", "watch"]

  # 2. Workloads & Apps
  - apiGroups: ["", "apps", "batch"]
    resources:
      - pods
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # 3. Networking
  - apiGroups: ["", "networking.k8s.io", "discovery.k8s.io"]
    resources:
      - services
      - endpoints
      - endpointslices
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]

  # 4. Service Mesh (Istio)
  - apiGroups: ["networking.istio.io", "security.istio.io"]
    resources:
      - gateways
      - virtualservices
      - destinationrules
      - serviceentries
      - peerauthentications
    verbs: ["get", "list", "watch"]

  # 5. Storage
  - apiGroups: ["", "storage.k8s.io"]
    resources:
      - persistentvolumes
      - persistentvolumeclaims
      - storageclasses
    verbs: ["get", "list", "watch"]

  # 6. Policy & Autoscaling
  - apiGroups: ["policy", "autoscaling"]
    resources:
      - poddisruptionbudgets
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]

  # 7. Config (Audit xem app đang cầm những cấu hình gì)
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: audit-binding-for-ldap-user
subjects:
- kind: User
  name: u-qpmvr
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: inventory-audit-cluster-role