# Warm-up pool k8s-example-sbapiv11. Dung chung namespace, PriorityClass, ServiceAccount, RBAC va
# ConfigMap script voi manifests.yaml; file nay chi chua phan rieng cua pool (urd.md muc 9.4).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nodepool-warmup-sbapiv11-config
  namespace: app-node-warmup
data:
  POOL: "k8s-example-sbapiv11"
  # Dinh ngay thuong 36-37 node (do 02-09/10/2026). Phan duoi nay autoscaler tu no tiep.
  TARGET_NODES: "36"
  NAMESPACE: "app-node-warmup"
  DEPLOY: "nodepool-warmup-sbapiv11-placeholder"
  # Khop voi lich CronJob nodepool-warmup-sbapiv11-stop.
  HOLD_UNTIL: "09:00"
  WAIT_SCALEUP_SECONDS: "1800"
  INTERVAL: "5"
  # Image bitnami/kubectl khong co tzdata - xem manifests.yaml.
  TZ: "<+07>-7"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodepool-warmup-sbapiv11-placeholder
  namespace: app-node-warmup
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nodepool-warmup-sbapiv11-placeholder
  template:
    metadata:
      labels:
        app: nodepool-warmup-sbapiv11-placeholder
    spec:
      priorityClassName: overprovisioning
      terminationGracePeriodSeconds: 0
      imagePullSecrets:
        - name: nexus-repo-secret
      nodeSelector:
        cloud.google.com/gke-nodepool: k8s-example-sbapiv11
      tolerations:
        - key: app
          operator: Equal
          value: non-system
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: nodepool-warmup-sbapiv11-placeholder
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pause
          image: common-docker.example.com/pause:3.9
          # Node 16 CPU / 32 GB: allocatable 15760m / ~29.2Gi, DaemonSet chiem toi 508m / 833Mi.
          # Pod lon nhat trong pool (zeebe) 4000m / 12Gi. Request nam giua hai can: vua node trong
          # sau DaemonSet, preempt xong du cho pod lon nhat, va khong lot vao node cu con le.
          resources:
            requests:
              cpu: "14000m"
              memory: "24Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "14000m"
              memory: "24Gi"
              ephemeral-storage: "1Gi"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nodepool-warmup-sbapiv11-start
  namespace: app-node-warmup
spec:
  # Workload bat tu 07:10 (scaler exception-ontime weekday_prestart). Clone VM 5.5-16.4 phut,
  # dung song song vai chuc may co the cham hon nen bat dau 06:40.
  schedule: "40 6 * * 1-5"
  timeZone: "Asia/Ho_Chi_Minh"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Khung 06:40 -> 09:00 = 8400s, cong 15 phut du.
      activeDeadlineSeconds: 9300
      backoffLimit: 2
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: warmup
              operator: In
              values: [2]
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
                status: "True"
      ttlSecondsAfterFinished: 72000
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: nodepool-warmup
          imagePullSecrets:
            - name: nexus-repo-secret
          containers:
            - name: warmup
              image: common-docker.example.com/bitnami/kubectl@sha256:34e2ab0a0735231b40583dd951fc0572d796acf2338fceee53f4963ca19adb24
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "/opt/warmup/warmup.sh"]
              envFrom:
                - configMapRef:
                    name: nodepool-warmup-sbapiv11-config
              volumeMounts:
                - name: script
                  mountPath: /opt/warmup
                - name: holidays
                  mountPath: /opt/holidays
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
          volumes:
            - name: script
              configMap:
                name: nodepool-warmup-script
                defaultMode: 0555
            # optional: thieu ConfigMap thi script canh bao va chay nhu ngay thuong.
            - name: holidays
              configMap:
                name: nodepool-warmup-holidays
                optional: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nodepool-warmup-sbapiv11-stop
  namespace: app-node-warmup
spec:
  schedule: "0 9 * * 1-5"
  timeZone: "Asia/Ho_Chi_Minh"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 3
      ttlSecondsAfterFinished: 72000
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: nodepool-warmup
          imagePullSecrets:
            - name: nexus-repo-secret
          containers:
            - name: stop
              image: common-docker.example.com/bitnami/kubectl@sha256:34e2ab0a0735231b40583dd951fc0572d796acf2338fceee53f4963ca19adb24
              imagePullPolicy: IfNotPresent
              command:
                - kubectl
                - -n
                - app-node-warmup
                - scale
                - deploy/nodepool-warmup-sbapiv11-placeholder
                - --replicas=0
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
